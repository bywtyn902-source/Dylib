name: FOX Build Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up environment
      run: |
        swift --version

    - name: Compile to Dylib
      run: |
        mkdir -p output
        swiftc -emit-library -emit-module -dynamiclib -o output/fox.dylib source.swift
        ls -la output/
    
    - name: Save Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FoxOverlayBinary
        path: output/
