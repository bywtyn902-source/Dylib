name: FOX Build Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up environment
      run: |
        swift --version

    - name: Compile to iOS Dylib
      run: |
        mkdir -p output
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        swiftc -target arm64-apple-ios -sdk $SDK_PATH -emit-library -o output/fox.dylib source.swift
        ls -la output/
    
    - name: Save Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FoxOverlayBinary
        path: output/
